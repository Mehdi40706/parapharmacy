version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: parapharmacie_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parapharmacie_db}
    ports:
      - "127.0.0.1:5432:5432" # Bound locally for safety
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parapharmacie_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-parapharmacie_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # Cloudinary replace MinIO
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Integrations & Payments
      KONNECT_API_URL: ${KONNECT_API_URL}
      KONNECT_API_KEY: ${KONNECT_API_KEY}
      KONNECT_WALLET_ID: ${KONNECT_WALLET_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      # Mail & Auth
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}     
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}  
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}   
      # AI & APIs
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "5000:5000"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parapharmacie_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: ${BACKEND_URL}
    ports:
      - "3000:3000"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: